<!DOCTYPE html>
<html lang="ru" xmlns:th"http://www.thymeleaf.org">
<head>
    <title>QEngine</title>
</head>
<body>
    <h1>Добро пожаловать в QEngine!</h1>
    
    <!-- Проверяем, аутентифицирован ли пользователь -->
    <div th:if="${#authorization.expression('isAuthenticated()')}">
        Вы вошли как: 
        <!-- Получаем имя через principal.name (для стандартного UserDetails) -->
        <span th:text="${#authentication.name}"></span>
    </div>
    <a href="/login">Войти</a> | <a href="/admin">Админка | <a href="/auth/register"> Регистрация</a>
</body>
</html>
